<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      (function(){
        var theme = localStorage.getItem('theme');
        if (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        if (!theme) theme = 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      html:not(.dark) { background: #e8eef0; }
      html.dark { background: #0d171b; }
    </style>
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;" />
    <link rel="dns-prefetch" href="https://himyxbrdsnxryetlogzk.supabase.co">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
